<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/png" href="https://raw.githubusercontent.com/danijelcecelja-create/echocoaching/main/echo.png?v=1">
<meta name="theme-color" content="#17241f">
<title>Vragenlijst | ECHO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script>
document.write('<link rel="stylesheet" href="style.css?v=' + Date.now() + '">');
</script>
</head>
<body>
<header></header>
<main id="top" class="page-shell">
  <button class="button button-quiet restart-control" id="restart-button" type="button">Opnieuw beginnen</button>

  <section class="intro" id="intro">
    <h1>Leer jezelf<br><span>beter begrijpen.</span></h1>
    <p class="intro-copy">Neem je tijd. Er zijn geen juiste of foute antwoorden. Kies per stelling het antwoord dat het best bij jou past.</p>
    <div class="intro-meta">
      <span class="dot"></span>
      <span id="question-count">232 vragen</span>
      <span class="meta-separator">/</span>
      <span>Je antwoorden worden tussentijds bewaard op dit toestel.</span>
    </div>
    <div class="respondent-field">
      <label class="respondent-label" for="respondent-name">Wat is je naam?</label>
      <input
        class="respondent-input"
        id="respondent-name"
        name="respondentName"
        type="text"
        autocomplete="name"
        maxlength="100"
        placeholder="Vul je naam in"
        required
      >
    </div>
    <button class="button button-primary" id="start-button" type="button">Start de vragenlijst <span aria-hidden="true">↗</span></button>
  </section>

  <dialog id="restart-dialog" aria-labelledby="restart-dialog-title">
    <h2 id="restart-dialog-title">Opnieuw beginnen?</h2>
